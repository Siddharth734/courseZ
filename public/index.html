<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseZ</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Headland+One&family=Share+Tech&display=swap');
  </style>
</head>

<body class="flex flex-col bg-gray-50">
  <div id="Maker">
    <div class="flex shadow-md p-2 justify-between">
      <input id="signup-btn-index"
      class="text-white bg-red-500 hover:bg-red-600 hover:cursor-pointer px-5 rounded-[20px] my-4"
      type="button" value="logout" onclick="">
      <p class="text-4xl text-slate-600 pt-4 font-['Headland_One',serif] font-extrabold">CourseZ</p>
      <div id="mycourse-profile" class="flex items-center gap-4">
        <img src="https://i.pinimg.com/736x/f6/b8/2c/f6b82c39d614449885332f251a145a31.jpg" alt="profile pic"
          class="h-[66px] w-[66px] rounded-full p-2">
      </div>
      <!-- <input id="login-btn"
        class="text-white bg-cyan-500 hover:bg-cyan-600 hover:cursor-pointer px-5 py-[10px] rounded-[20px] my-4" type="button"
        value="Signup" onclick="toggleMaker();"> -->
    </div>

    <div class="flex min-h-screen">
      <div class="flex flex-col shadow-xl/30 pt-5 gap-6 w-32">
        <a class="text-slate-600 p-2 hover:bg-gray-100" href="home.html">Courses</a>
        <a class="text-slate-600 p-2 hover:bg-gray-100" href="index.html">My Courses</a>
      </div>

      <div class="flex-1 p-6">
        <div id="courses" class="grid grid-cols-1 gap-10 p-8 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
          <div class="relative group h-[250px] w-[300px] border border-gray-400 rounded-2xl hover:shadow-xl hover:border-0">
            <div class="text-3xl h-[58%] font-bold bg-[url(https://plus.unsplash.com/premium_photo-1661963874418-df1110ee39c1?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHRlY2huaWNhbHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&q=60&w=600)] bg-cover bg-center rounded-t-2xl p-10 hover:underline"></div>
            <div class="rounded-[5px] text-xl p-4">How to write Hello world!</div>
            <button class="absolute rounded-xl b-110 left-10 p-2 bg-[#393E46] text-white hover:bg-[#222831]"
            onclick="">Open <i class="ri-expand-diagonal-2-line"></i></button>
          </div>
          
          <div class="relative group h-[250px] w-[300px] border border-gray-400 rounded-2xl hover:shadow-xl hover:border-0">
            <div class="text-3xl h-[58%] font-bold bg-[url(https://images.unsplash.com/photo-1694878982234-58d53e0d1655?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDN8fHdlYnNpdGUlMjBzY3JlZW58ZW58MHwwfDB8fHww&auto=format&fit=crop&q=60&w=600)] bg-cover bg-center rounded-t-2xl p-10 hover:underline"></div>
            <div class="rounded-[5px] text-xl p-4">Life is an adventure: How to enjoy</div>
            <button class="absolute rounded-xl b-100 left-10 p-2 bg-[#393E46] text-white hover:bg-[#222831]"
            onclick="">Open <i class="ri-expand-diagonal-2-line"></i></button>
          </div>
          <div class="relative group h-[250px] w-[300px] border border-gray-400 rounded-2xl hover:shadow-xl hover:border-0">
            <div class="text-3xl h-[58%] font-bold bg-[url(https://images.unsplash.com/photo-1694878982234-58d53e0d1655?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDN8fHdlYnNpdGUlMjBzY3JlZW58ZW58MHwwfDB8fHww&auto=format&fit=crop&q=60&w=600)] bg-cover bg-center rounded-t-2xl p-10 hover:underline"></div>
            <div class="rounded-[5px] text-xl p-4">How to write Hello world!</div>
            <button class="absolute rounded-xl b-100 left-10 p-2 bg-[#393E46] text-white hover:bg-[#222831]"
            onclick="">Open <i class="ri-expand-diagonal-2-line"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="axios.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
